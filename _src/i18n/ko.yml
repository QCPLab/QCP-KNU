motion:
  fig: "그림"
  sim: "모의 자료이며 실험 자료가 아닙니다."
  nojs: "이 그림은 애니메이션이라 JavaScript가 필요합니다. 아래 설명을 참고하십시오."
  scenes:
    pk:
      tab: "약동학"
      title: "경구 투여 후의 노출."
      text: "A, 투여량 중 투여 부위에 남은 비율, 혈장에 있는 비율, 소실된 비율(사각형 하나가 2.5%). 화살표 굵기는 그 순간의 속도를 나타내며 화살표마다 자체 최댓값을 기준으로 합니다. B, 1차 흡수·1차 소실을 따르는 1구획 모형의 혈장 농도 C(t) = ka/(ka – ke) · (exp(–ke·t) – exp(–ka·t))를 기준 조건의 최고 농도에 대한 상대값으로 나타냈으며, ka = 1.0 h⁻¹, ke = 0.20 h⁻¹입니다(부피는 그대로 두고 청소율을 절반으로 줄이면 0.10 h⁻¹). 투여량과 부피는 1, 흡수는 완전하다고 두었습니다."
    metabolism:
      tab: "약물대사"
      title: "모약물에서 대사체로."
      text: "A, 투여량이 모약물, 대사체, 소실로 나뉜 비율. 화살표 굵기는 그 순간의 속도를 나타내며 화살표마다 자체 최댓값을 기준으로 합니다. B, 시간에 따른 양. 정맥 투여한 약물이 하나의 대사체로 1:1(몰 기준) 전환되고(속도상수 0.36 h⁻¹, 효소 저해 시 0.09 h⁻¹) 대사체는 소실됩니다(0.18 h⁻¹). 모약물은 대사로만 제거됩니다."
    transport:
      tab: "약물수송체"
      title: "수송체에서의 경쟁."
      text: "A, 투여량 중 혈장에 있는 비율과 간으로 흡수된 비율, 그리고 기질이 차지하거나 저해제가 차지하거나 비어 있는 수송체 결합 부위 열 개(화살표 굵기는 흡수 속도). B, 혈장 농도. 정맥 투여 후 기질은 포화되는 수송체로 흡수되며 v = Vmax · C / (Km (1 + [I]/Ki) + C), 최대 속도 Vmax = 0.5 h⁻¹(상대 단위), 미카엘리스 상수 Km = 0.8, 초기 농도는 1입니다. 농도가 일정한 저해제가 같은 자리에 경쟁적으로 결합하므로([I]/Ki = 3) 기질이 쓸 수 있는 자리가 줄고, 흡수 속도는 Vmax에 기질이 차지한 자리의 비율을 곱한 값과 같습니다. 다른 소실 경로는 없습니다."
    modeling:
      tab: "모델링"
      title: "모형 적합 후 예측."
      text: "A, 모형의 모수와 잔차제곱합. B, 100 mg 경구 단회 투여 후 24 h까지 측정한 것으로 모의한 농도 9개(점선은 마지막 측정 시점, 로그정규 오차 8%)를 로그 변환 값에 대한 최소제곱법으로 1구획 모형에 적합합니다. 곡선은 채택된 Levenberg–Marquardt 단계를 따라 움직이며 단계 사이는 보간한 것입니다. 적합한 모형으로 12 h마다 100 mg을 투여하는 경우를 투여량이 선형으로 더해진다고 보고 예측하며, 이 투여 방식은 측정하지 않았습니다."
      more: "집단 모형은 이를 여러 피험자로 확장합니다:"
      more_link: "비선형 혼합효과 설명"
    bioanalysis:
      tab: "생체시료 분석"
      title: "크로마토그램에서 농도까지, LC-MS/MS."
      text: "A, 분석물질과 안정동위원소 표지 내부표준물질(SIL-IS)의 크로마토그램으로, 두 물질은 함께 용출되며 피크 면적을 적분합니다. B, 면적비를 1/x² 가중으로 적합한 검량선에서 읽습니다. 검량선 표준시료의 면적비는 크로마토그램이 아니라 직선에 3% 오차를 더해 생성했으며, 매트릭스 효과와 회수율은 반영하지 않았습니다."
