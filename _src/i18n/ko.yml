methods:
  title: "직접 체험하는 방법론"
  lead: "가상 환자와 공개 분자 구조로 만든 두 가지 설명 도구로, 현대 약리학에서 쓰는 방법이 어떻게 작동하는지 직접 조작해 보며 확인할 수 있습니다. 환자나 우리 실험의 결과가 아닌 교육용 예제입니다."
  honesty: "환자는 모두 가상(시뮬레이션)입니다. 두 번째 딥러닝 예제의 분자는 실제 공개 구조이며, logP는 측정값이 아니라 소프트웨어가 계산한 값입니다. 계산은 사용자의 브라우저에서 이루어지며, 어떤 정보도 외부로 전송되지 않습니다."
  needs_js: "이 설명 도구를 사용하려면 JavaScript가 필요합니다. JavaScript를 켜 주십시오."
  nlme_eyebrow: "집단 약동학"
  nlme_title: "집단 약동학 모형은 어떻게 추정되는가"
  nlme_lead: "약물이 제거되는 속도는 사람마다 다릅니다. 비선형 혼합효과(NLME) 모형은 전형적인 값과 개체 간 변동을 한꺼번에 기술합니다. 추정 알고리즘은 부정확한 초깃값에서 출발해 한 단계씩 값을 개선하며, 여기서는 그 모든 단계를 직접 넘겨 볼 수 있습니다."
  nlme_steps: ["채혈 시나리오(풍부·중간·희소)를 고릅니다.", "재생 버튼을 누르거나 슬라이더를 끌어 반복 단계를 이동합니다.", "적합 곡선, 모수 추정치, 목적함수가 어떻게 변하는지 확인합니다.", "개체를 선택해 그 개체의 자료와 개체별 적합을 비교합니다."]
  nlme_limits: "가상 개체 30명의 시뮬레이션 자료와 하나의 모형만 사용합니다. 추정기는 상호작용을 고려한 1차 조건부 추정법(FOCE-I)을 처음부터 직접 구현한 것으로, 원리를 보여 주기 위한 것이며 검증된 상용·공개 소프트웨어를 대체하지 않습니다."
  dl_eyebrow: "딥러닝"
  dl_title: "신경망은 어떻게 계산하는가"
  dl_lead: "신경망은 가중합과 비선형 함수라는 단순한 계산의 연쇄입니다. 학습은 오차가 줄어들도록 가중치를 바꾸는 과정입니다. 순전파를 실행하고, 역전파의 기울기를 확인하고, 실제 약물 분자 위에서 메시지 전달이 일어나는 모습을 따라가 보십시오."
  dl_limits: "소형 모형을 쓴 교육용 예제입니다. 신경망은 가상 환자 자료에서 이미 알려진 공식을 학습하고, 그래프 신경망은 공개 구조 약 4,600개(RDKit에 포함된 NCI Open Database)를 이용해 RDKit이 계산한 Crippen logP(측정값이 아님)를 재현하도록 학습합니다. 작동 원리를 보여 줄 뿐 예측 용도로 검증된 모형이 아닙니다."
  reading_eyebrow: "더 읽을거리"
  reading_title: "더 읽을거리"
  reading_sub: "위에서 다룬 방법에 대한 일반 참고문헌이며, 이 연구실의 논문이 아닙니다. 모든 DOI는 2026년 10월 13일에 Crossref로 확인했습니다."

