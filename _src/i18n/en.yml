  lead: "We study how drugs are absorbed, distributed, metabolized and excreted, and how these processes change with disease, drug–drug interactions and individual differences. We connect animal and in vitro experiments, LC-MS/MS bioanalysis and quantitative modeling to drug discovery and the safe use of medicines."
  cta_research: "Explore our research"
  cta_methods: "Try the interactive methods"
  caption: "Illustration: simulated concentration–time profiles (one-compartment model). Not real data."
