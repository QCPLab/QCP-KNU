motion:
  fig: "Fig."
  sim: "Simulated; not laboratory data."
  nojs: "This figure is animated and needs JavaScript. The caption below describes it."
  scenes:
    pk:
      tab: "Pharmacokinetics"
      title: "Exposure after an oral dose."
      text: "A, concentration–time curve of a one-compartment model with first-order absorption and elimination, C(t) = ka/(ka – ke) · (exp(–ke·t) – exp(–ka·t)), relative to the reference peak, with the area under the curve filling in and the peak marked; ka = 1.0 h⁻¹, ke = 0.20 h⁻¹ (0.10 h⁻¹ when clearance is halved at unchanged volume). B, the same curve on a log scale: after absorption the decline is a straight line with slope –ke, from which the half-life follows. C, share of the dose at the dose site, in plasma and eliminated; the eliminated share equals AUC(0–t)/AUC(0–∞). The table lists the exposure parameters relative to the reference. Dose and volume are set to 1 and absorption is complete."
    metabolism:
      tab: "Metabolism"
      title: "From parent drug to metabolite."
      text: "A, the pathway: an intravenous dose is converted one-to-one (molar) into a single metabolite (rate constant 0.36 h⁻¹; 0.09 h⁻¹ with the enzyme inhibited), which is eliminated (0.18 h⁻¹); the parent is cleared by metabolism only. Arrow width follows the instantaneous rate, each arrow on its own scale. B, where the dose is over time, as a stacked area that always sums to 100 % (mass balance); dashed lines mark the boundaries with typical metabolism."
    transport:
      tab: "Transporters"
      title: "Competition at a transporter."
      text: "A, share of the dose in plasma and taken up into the liver, and ten transporter sites that are held by the substrate, held by the inhibitor or free, shown rounded to whole tenths (arrow width follows the uptake rate). B, plasma concentration after an intravenous dose; the substrate is taken up by a saturable transporter, v = Vmax · C / (Km (1 + [I]/Ki) + C), with maximal rate Vmax = 0.5 h⁻¹ (relative units), Michaelis constant Km = 0.8 and initial concentration 1. An inhibitor at constant concentration binds the same sites (competitive), so fewer sites are free for the substrate; the rate equals Vmax times the share of sites held by the substrate. There is no other elimination. C, AUC(0–∞) ratio against [I]/Ki; the curves in B are cut at 24 h, the ratio uses the whole curve. For this model AUC ratio = 1 + ([I]/Ki) · Km/(Km + C0/2). The cut-offs 1.25, 2 and 5, used to classify CYP inhibitors as weak, moderate or strong, are drawn only as a scale."
    modeling:
      tab: "Model fitting"
      title: "Fitting a model, then predicting."
      text: "A, nine concentrations after one 100 mg oral dose, measured up to 24 h (dotted vertical line; simulated with 8 % log-normal error), are fitted to the one-compartment model by least squares on the log scale; the fitted model then predicts 100 mg every 12 h, adding the doses linearly, a regimen that was not measured. B, sum of squares over CL/F and V/F, minimized over ka at each point (contours at 1.5, 3, 8, 25 and 80 times the minimum), with the Levenberg–Marquardt path projected onto this plane (dots mark accepted steps; positions between steps are interpolated) and the values used to simulate the data (open circle). C, parameters and sum of squares at the current step."
      more: "Population models extend this to many subjects:"
      more_link: "nonlinear mixed-effects explainer"
    nlme:
      tab: "Population PK"
      title: "Estimating a population model."
      text: "A, observations of 30 simulated subjects (dots), each subject's fit with its empirical Bayes estimates (thin lines), the population curve (blue), the simulated true curve (dashed) and the 90 % range of the model with between-subject variability only (240 simulated subjects, no residual error). B, objective function value (OFV, about –2 log-likelihood with constants included) at each accepted iteration; it depends on the number of observations, so compare it only within one run, not between sampling designs or with other software. C, population estimates divided by the values used to simulate (fixed effects only). D, empirical Bayes estimates η̂ of CL/F against V/F for each subject, with the ±2ω ellipse (ω is the standard deviation of η, the between-subject variability). Positions between accepted iterations are interpolated. This replays a real run of FOCE with interaction (one-compartment oral model, log-normal between-subject variability, proportional error) that was implemented for this site; change the number of samples per subject to see how the estimates and the η-shrinkage change. The explainer lists all seven parameters with their standard errors."
      more: "Step through every iteration and compare designs:"
      more_link: "nonlinear mixed-effects explainer"
    bioanalysis:
      tab: "Bioanalysis"
      title: "From chromatogram to concentration by LC-MS/MS."
      text: "A, the instrument chain; the detector box darkens with the signal. B, chromatogram of the analyte and its stable-isotope-labeled internal standard (SIL-IS), which elute together; the peak areas are integrated. C, the area ratio is read against a calibration curve fitted with 1/x² weighting. The calibrator ratios were generated from a straight line with 3 % error, not from chromatograms; matrix effects and recovery are not modeled."
