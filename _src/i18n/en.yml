research:
  title: Research
  lead: 'Our work follows a drug from the dose to the concentration in the body: how it is absorbed, metabolized, transported and eliminated, and what changes that in disease, with other drugs and between individuals.'
  on_this_page: On this page
  approaches: Approaches
  selected: Selected publications
  bio_nav: Bioanalysis
  official_nav: Department topics
  official_title: Research topics listed by the College of Pharmacy
  official_text: The department's laboratory page lists five research topics. The four areas above group them and add the quantitative modeling that connects them.
  official_link: View the department page
  cta_title: Methods
  cta_text: How we run animal and in vitro pharmacokinetic studies and LC-MS/MS assays, and two interactive explainers of population models and neural networks.
  cta_btn: Open the methods page.
methods:
  title: Methods
  lead: Our laboratory combines animal and in vitro pharmacokinetic experiments, LC-MS/MS bioanalysis and quantitative modeling. The first three sections describe the experimental work that runs through our publication list; the last two are interactive explainers of modeling methods.
  workflow: Typical workflow
  examples: Examples from our publications
  honesty: 'About the two interactive explainers: they are teaching examples built on simulated patients and public molecule structures, not results from patients or from our experiments. In the deep-learning example the molecules are real public structures and their logP is calculated by software, not measured. The calculations run in your browser; nothing is sent anywhere.'
  needs_js: These explainers need JavaScript. Please enable it to use them.
  nlme_title: How a population PK model is fitted
  nlme_lead: People differ in how fast they clear a drug. A nonlinear mixed-effects (NLME) model describes the typical values and the spread between individuals at once. The optimizer starts from poor guesses and improves them step by step; here you can move through every step.
  nlme_steps:
  - 'Choose a sampling scenario: rich, moderate or sparse.'
  - Press play, or drag the slider through the optimizer's iterations.
  - Watch the fitted curves, the parameter estimates and the objective function change.
  - Select a subject to compare its data with its individual fit.
  nlme_limits: Simulated data from 30 virtual subjects and a single model. The estimator is a from-scratch implementation of first-order conditional estimation with interaction (FOCE-I). It illustrates the idea and is not a substitute for validated software.
  dl_title: How a neural network computes
  dl_lead: 'A neural network is a chain of simple calculations: weighted sums followed by a non-linearity. Training changes the weights to reduce the error. Run the forward pass, inspect the gradients of the backward pass, and follow message passing across a real drug molecule.'
  dl_limits: Teaching examples with small models. The neural network learns a known formula from synthetic patients. The graph network learns to reproduce the Crippen logP that RDKit calculates (a calculated value, not a measurement) from a set of about 4,600 public structures (about 3,200 of them used for training) (NCI Open Database, as shipped with RDKit). They show the mechanics and are not validated for prediction.
  reading_title: Further reading
  reading_sub: General references for the methods above; they are not publications of this laboratory.
