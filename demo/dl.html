<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep-learning explorer (demo)</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/dl-explorer.css">
<style>
  /* demo page only: the widget itself sets no global styles */
  body{margin:0;padding:16px;font-family:var(--font);background:var(--bg);color:var(--ink-2)}
  main{max-width:1100px;margin:0 auto}
  .demo-nav{margin:0 0 16px;font-size:.9rem}
  .demo-nav a{color:var(--accent-2);margin-right:12px}
</style>
</head>
<body>
<main>
  <p class="demo-nav"><a href="dl.html">English</a><a href="dl.html?lang=ko">한국어</a></p>
  <div id="dl-mount" data-lab-widget="dl-explorer" data-mlp="../assets/data/dl-mlp.json" data-gnn="../assets/data/dl-gnn.json" data-lang="en"></div>
</main>
<script>
  /* demo only: ?lang=ko switches the widget and page language before the widget script runs */
  (function () {
    var ko = /[?&]lang=ko\b/.test(location.search);
    if (ko) { document.documentElement.lang = 'ko'; document.getElementById('dl-mount').setAttribute('data-lang', 'ko'); }
  })();
</script>
<script src="../assets/js/dl-explorer.js"></script>
</body>
</html>
